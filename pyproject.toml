[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-watcher"
version = "0.1.0"
description = "Bot que monitorea portales de empleo venezolanos y notifica por Telegram"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TU NOMBRE", email = "tu@email.com" }]
dependencies = [
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "types-pyyaml>=6.0.0",
    "types-requests>=2.32.0",
]

[project.scripts]
job-watcher = "job_watcher.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/job_watcher"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=job_watcher --cov-report=term-missing --cov-fail-under=80"

[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["misc"]
