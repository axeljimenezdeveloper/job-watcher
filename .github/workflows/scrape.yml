name: Scrape

on:
  schedule:
    - cron: '0 */3 * * *'  # cada 3 horas UTC
  workflow_dispatch: {}     # boton "Run workflow" en la UI

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04   # pin explicito (evita migracion Ubuntu 26)
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Restore job database from cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: jobs-db-

      - name: Restore job database from artifact (fallback)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: jobs-db-*
          merge-multiple: true
          path: data/
        continue-on-error: true

      - name: Create .env from secrets
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" > .env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env

      - name: Run job watcher
        run: python -m job_watcher

      - name: Save job database to cache
        if: always() && hashFiles('data/jobs.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload job database as artifact (backup)
        if: always() && hashFiles('data/jobs.db') != ''
        uses: actions/upload-artifact@v4
        with:
          name: jobs-db-${{ github.run_id }}
          path: data/jobs.db
          retention-days: 90

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="Job Watcher fallo. Run: ${{ github.run_id }}"
